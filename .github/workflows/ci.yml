name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install build tools & dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel pytest
        pip install -e ".[dev]"

    - name: Sanitization & Path Scan
      run: |
        python scripts/scan_drive_letters.py

    - name: Run Test Suite
      env:
        PYTHONUTF8: "1"
      run: |
        python -m pytest tests/test_smoke.py -v
        python -m pytest -q

    - name: Build & Verify Wheel Artifact
      run: |
        python setup.py bdist_wheel
        python -m pip install --force-reinstall dist/*.whl
        python -c "import memory; print('Memory engine imported successfully from wheel!')"
        xtmem --help
