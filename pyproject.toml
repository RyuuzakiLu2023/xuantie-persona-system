[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xtmem"
version = "0.1.0"
description = "XTMEM — Multi-role shared memory engine & cross-agent context infrastructure"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ryuuzaki Lu", email = "ryuuzakilu@gmail.com" }
]
keywords = [
    "memory-system",
    "agent-memory",
    "long-term-memory",
    "multi-agent",
    "sqlite",
    "retrieval",
    "llm",
    "prompt-cache"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "jieba>=0.42.1",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
    "PyYAML>=6.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "flake8>=6.0.0",
]
host = [
    "hermes-agent",
]

[project.scripts]
xtmem = "xtmem:main"

[project.urls]
Homepage = "https://github.com/RyuuzakiLu2023/xuantie-persona-system"
Documentation = "https://github.com/RyuuzakiLu2023/xuantie-persona-system#readme"
Repository = "https://github.com/RyuuzakiLu2023/xuantie-persona-system.git"
Issues = "https://github.com/RyuuzakiLu2023/xuantie-persona-system/issues"

[tool.setuptools]
py-modules = ["xtmem"]

[tool.setuptools.package-dir]
"" = "src/cli"
"memory" = "src/hermes-plugin/memory"

[tool.setuptools.packages.find]
where = ["src/hermes-plugin/memory"]
include = ["memory*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
