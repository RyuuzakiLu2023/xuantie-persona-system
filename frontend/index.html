  html[data-theme="paper"] { background: #ece3d2; }
  #root { min-height: 100dvh; }
  .boot { display: grid; place-items: center; min-height: 100dvh;
          font: 400 14px/1.7 system-ui, sans-serif; color: #8b8578; letter-spacing: .18em; }

</head>
<body>
<div id="root"><div class="boot">照 渊 台 · 起 灯</div></div>

</noscript>
<script type="module" src="/src/main.tsx"></script>
